name: Weekly Tests

on:
  schedule:
    - cron: '0 9 * * 0'  # Runs weekly on Sunday at 9:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    #runs-on: ubuntu-latest #The docker hosted runners are getting flagged by strato
    runs-on: [self-hosted, linux, docker]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run integration tests
      env:
        STRATO_API: ${{ vars.STRATO_API }}
        STRATO_IDENTIFIER: ${{ secrets.STRATO_IDENTIFIER }}
        STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
        STRATO_ORDER: ${{ secrets.STRATO_ORDER }}
        STRATO_DOMAIN: ${{ secrets.STRATO_DOMAIN }}
      run: echo Testing against API $STRATO_API && go test -test.v ./...

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: Create issue on test failure
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '❌ Daily Tests Failed',
            body: `Daily tests have failed!\n\n**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n**Branch:** ${{ github.ref }}\n**Commit:** ${{ github.sha }}\n\nPlease check the workflow run for details.`,
            labels: ['test-failure', 'automated']
          })
